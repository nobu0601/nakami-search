name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=optional
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=optional
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: nakami-search-windows
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Pushing to main publishes a release named after package.json's version.
      # Bump the version to make a new release; the same version is updated in place.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: なかみ検索 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: |
            Windows 用インストーラーです。下の `nakami-search-setup-${{ steps.ver.outputs.version }}.exe` をダウンロードして実行してください。
            初回に「Windows によって PC が保護されました」と表示されたら「詳細情報」→「実行」を押してください。
